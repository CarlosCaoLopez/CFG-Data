[tool.poetry]
name = "polymarket-insider-detection"
version = "0.1.0"
description = "Sistema de detección de insider trading en Polymarket"
authors = []

packages = [
    { include = "queue_system" },
    { include = "contracts" },
]


[tool.poetry.dependencies]
python = "^3.11"

# APIs y HTTP
aiohttp = "^3.9"
httpx = "^0.27"
websockets = "^12.0"

# Blockchain (for on-chain event decoding)
web3 = "^6.0"
eth-abi = "^5.0"

# Polymarket client
py-clob-client = "^0.1"

# Queue
redis = "^5.0"

# Database
asyncpg = "^0.29"
sqlalchemy = "^2.0"
alembic = "^1.13"

# Data validation
pydantic = "^2.5"
pydantic-settings = "^2.1"

# Cálculos
numpy = "^1.26"

# Utils
python-dotenv = "^1.0"
structlog = "^24.1"
setuptools = "^80.10.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
pytest-mock = "^3.12"
fakeredis = "^2.21"
freezegun = "^1.4"
ruff = "^0.2"
mypy = "^1.8"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
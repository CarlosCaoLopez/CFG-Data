<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CFG Data — Login</title>
  <link rel="icon" type="image/png" href="/static/cfg-favicon-white.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-8">
      <img src="/static/cfg-large-negat.png" alt="CFG Data" class="h-14 w-auto"/>
      <p class="text-xs text-slate-500 mt-2 tracking-wide">Insider Detection</p>
    </div>

    <form method="post" action="/auth/login" class="bg-slate-800 border border-slate-700 rounded-xl p-8 space-y-5">
      <div x-data="{ show: false }">
        <label class="block text-sm font-medium text-slate-300 mb-2">Contraseña</label>
        <div class="relative">
          <input
            :type="show ? 'text' : 'password'"
            name="password"
            autofocus
            required
            placeholder="••••••••"
            class="w-full bg-slate-700 border border-slate-600 text-white rounded-lg px-4 py-2.5 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-[#3333FF]"
          />
          <button
            type="button"
            @click="show = !show"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-500 hover:text-slate-400"
            tabindex="-1"
          >
            <svg x-show="!show" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <svg x-show="show" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"/>
            </svg>
          </button>
        </div>
      </div>

      {% if error %}
      <p class="text-red-400 text-sm">Contraseña incorrecta.</p>
      {% endif %}

      <button type="submit"
              class="w-full text-white font-semibold py-2.5 rounded-lg text-sm transition-colors"
              style="background-color: #3333FF;"
              onmouseover="this.style.backgroundColor='#2929CC'"
              onmouseout="this.style.backgroundColor='#3333FF'">
        Entrar
      </button>
    </form>

    <p class="text-center text-xs text-slate-600 mt-4">La sesión caduca en 1 hora.</p>
  </div>
</body>
</html>

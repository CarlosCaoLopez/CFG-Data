{% extends "base.html" %}
{% block title %}Insiders{% endblock %}
{% block content %}
<div x-data="insidersPage()" x-init="load()">

  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold text-white">Insider Wallets</h2>
    <button @click="load()" class="btn-ghost text-xs">↻ Actualizar</button>
  </div>

  <div class="card mb-4 flex gap-3 items-center flex-wrap">
    <input x-model="filter_category" @keyup.enter="load()" class="input" placeholder="Filtrar por categoría…"/>
    <button @click="load()" class="btn-primary">Filtrar</button>
    <span class="text-xs text-slate-500 ml-auto" x-text="total + ' insiders'"></span>
  </div>

  <div class="table-wrap mb-4">
    <table>
      <thead>
        <tr>
          <th>Wallet</th>
          <th>Categorías insider</th>
          <th>Markets</th>
          <th>Trades insider</th>
          <th>Volumen total</th>
          <th>Antigüedad (Polygon)</th>
          <th>Detectado</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="w in items" :key="w.address">
          <tr class="cursor-pointer" @click="goTo(w)">
            <td><span class="font-mono text-indigo-400 text-xs" x-text="w.address.slice(0,10) + '…' + w.address.slice(-4)"></span></td>
            <td>
              <div class="flex flex-wrap gap-1">
                <template x-for="cat in (w.categories_insider || [])"><span class="badge-red text-xs" x-text="cat"></span></template>
              </div>
            </td>
            <td class="text-right" x-text="(w.marketids_insider || []).length"></td>
            <td class="text-right" x-text="w.insider_trades_count"></td>
            <td class="text-right font-mono text-xs" x-text="fmtUSD(w.total_volume_usdc)"></td>
            <td class="text-xs text-slate-400" x-text="fmtDate(w.first_tx_polygon)"></td>
            <td class="text-xs text-slate-400" x-text="fmtDate(w.updated_at)"></td>
          </tr>
        </template>
        <tr x-show="!items.length">
          <td colspan="7" class="text-center text-slate-500 py-8">Sin insiders detectados aún</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="flex justify-between items-center mb-6">
    <button @click="prevPage()" :disabled="page === 1" class="btn-ghost disabled:opacity-40">← Anterior</button>
    <span class="text-xs text-slate-400" x-text="'Página ' + page"></span>
    <button @click="nextPage()" :disabled="page * limit >= total" class="btn-ghost disabled:opacity-40">Siguiente →</button>
  </div>
</div>

<script>
function insidersPage() {
  return {
    items: [], total: 0, page: 1, limit: 50,
    filter_category: '',
    async load() {
      const params = new URLSearchParams({ page: this.page, limit: this.limit });
      if (this.filter_category) params.set('category', this.filter_category);
      const r = await fetch('/api/insiders?' + params);
      const d = await r.json();
      this.items = d.items; this.total = d.total;
    },
    goTo(w) { window.location.href = '/insiders/' + w.address; },
    nextPage() { this.page++; this.load(); },
    prevPage() { if (this.page > 1) { this.page--; this.load(); } },
    fmtUSD(n) { return '$' + parseFloat(n ?? 0).toLocaleString(undefined, {maximumFractionDigits: 0}); },
    fmtDate(iso) { if (!iso) return '—'; return new Date(iso).toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}); },
  }
}
</script>
{% endblock %}

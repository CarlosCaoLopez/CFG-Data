{% extends "base.html" %}
{% block title %}Trades{% endblock %}
{% block content %}
<div x-data="tradesPage()" x-init="load()">

  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold text-white">Trade Explorer</h2>
    <button @click="load()" class="btn-ghost text-xs">↻ Actualizar</button>
  </div>

  <div class="card mb-4 flex flex-wrap gap-3 items-center">
    <select x-model="filter_table" @change="page=1; load()" class="input">
      <option value="insider">Insider trades</option>
      <option value="normal">Trades normales</option>
      <option value="all">Todos</option>
    </select>
    <select x-model="filter_side" @change="page=1; load()" class="input">
      <option value="">Lado (todos)</option>
      <option value="BUY">BUY</option>
      <option value="SELL">SELL</option>
    </select>
    <input x-model="filter_wallet" @keyup.enter="page=1; load()" class="input w-48" placeholder="Wallet 0x…"/>
    <button @click="page=1; load()" class="btn-primary">Filtrar</button>
    <span class="text-xs text-slate-500 ml-auto" x-text="total + ' trades'"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Wallet</th>
          <th>Market</th>
          <th>Timestamp</th>
          <th>Side</th>
          <th>Outcome</th>
          <th>Price</th>
          <th class="text-right">USDC</th>
          <th>Fuente</th>
          <th>Last</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="t in items" :key="t.id">
          <tr>
            <td class="font-mono text-xs text-indigo-400" x-text="t.wallet_id?.slice(0,10)+'…'"></td>
            <td class="text-xs max-w-xs">
              <span class="line-clamp-1 text-slate-300" x-text="t.question || (t.market_id?.slice(0,14)+'…')"></span>
            </td>
            <td class="text-xs font-mono text-slate-400" x-text="fmtDate(t.timestamp)"></td>
            <td><span :class="t.side === 'BUY' ? 'badge-green' : 'badge-red'" x-text="t.side"></span></td>
            <td class="text-xs" x-text="t.outcome"></td>
            <td class="font-mono text-xs" x-text="parseFloat(t.prize || 0).toFixed(3)"></td>
            <td class="font-mono text-xs text-right" x-text="fmtUSD(t.size_usdc)"></td>
            <td><span :class="t.source === 'insider' ? 'badge-red' : 'badge-blue'" x-text="t.source"></span></td>
            <td><span x-show="t.last_trade" class="badge-yellow">✓</span></td>
          </tr>
        </template>
        <tr x-show="!items.length">
          <td colspan="9" class="text-center text-slate-500 py-8">Sin trades</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="flex justify-between items-center mt-4">
    <button @click="prevPage()" :disabled="page === 1" class="btn-ghost disabled:opacity-40">← Anterior</button>
    <span class="text-xs text-slate-400" x-text="'Página ' + page + ' · ' + total + ' resultados'"></span>
    <button @click="nextPage()" :disabled="page * limit >= total" class="btn-ghost disabled:opacity-40">Siguiente →</button>
  </div>
</div>

<script>
function tradesPage() {
  return {
    items: [], total: 0, page: 1, limit: 100,
    filter_table: 'insider', filter_side: '', filter_wallet: '',
    async load() {
      const p = new URLSearchParams({ page: this.page, limit: this.limit, table: this.filter_table });
      if (this.filter_side) p.set('side', this.filter_side);
      if (this.filter_wallet) p.set('wallet', this.filter_wallet);
      const r = await fetch('/api/trades?' + p);
      const d = await r.json();
      this.items = d.items; this.total = d.total;
    },
    nextPage() { this.page++; this.load(); },
    prevPage() { if (this.page > 1) { this.page--; this.load(); } },
    fmtUSD(n) { return '$' + parseFloat(n ?? 0).toLocaleString(undefined, {maximumFractionDigits: 2}); },
    fmtDate(iso) { if (!iso) return '—'; return new Date(iso).toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}); },
  }
}
</script>
{% endblock %}

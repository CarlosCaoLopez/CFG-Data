<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Insider Detection{% endblock %} — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }

    /* Sidebar items — icon + text side by side */
    .sidebar-item {
      display: flex;
      align-items: center;
      flex-direction: row;
      gap: 0.75rem;
      padding: 0.625rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.15s, color 0.15s;
      color: #cbd5e1; /* slate-300 */
    }
    .sidebar-item:hover { background-color: #334155; color: #fff; }
    .sidebar-item.active { background-color: #4f46e5; color: #fff; }

    /* Cards */
    .card {
      background-color: #1e293b;
      border-radius: 0.75rem;
      border: 1px solid #334155;
      padding: 1.25rem;
    }

    /* Badges */
    .badge-green, .badge-red, .badge-yellow, .badge-blue {
      display: inline-flex; align-items: center;
      padding: 0.125rem 0.5rem; border-radius: 0.25rem;
      font-size: 0.75rem; font-weight: 500;
    }
    .badge-green  { background-color: #064e3b; color: #6ee7b7; }
    .badge-red    { background-color: #450a0a; color: #fca5a5; }
    .badge-yellow { background-color: #422006; color: #fcd34d; }
    .badge-blue   { background-color: #1e3a5f; color: #93c5fd; }

    /* Tables */
    .table-wrap { overflow-x: auto; border-radius: 0.5rem; border: 1px solid #334155; }
    table       { width: 100%; font-size: 0.875rem; text-align: left; border-collapse: collapse; }
    thead       { background-color: #334155; color: #94a3b8; text-transform: uppercase; font-size: 0.75rem; }
    th          { padding: 0.75rem 1rem; font-weight: 600; }
    td          { padding: 0.75rem 1rem; color: #cbd5e1; border-top: 1px solid #334155; }
    tr:hover td { background-color: #1e2d40; }

    /* KPI cards */
    .kpi-card  { display: flex; flex-direction: column; gap: 0.25rem; }
    .kpi-value { font-size: 1.875rem; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
    .kpi-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }

    /* Buttons */
    .btn        { padding: 0.375rem 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; transition: background-color 0.15s; cursor: pointer; border: none; }
    .btn-primary { background-color: #4f46e5; color: #fff; }
    .btn-primary:hover { background-color: #4338ca; }
    .btn-ghost  { background-color: #334155; color: #cbd5e1; }
    .btn-ghost:hover { background-color: #475569; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Inputs */
    .input {
      background-color: #334155; border: 1px solid #475569; color: #e2e8f0;
      font-size: 0.875rem; border-radius: 0.5rem; padding: 0.375rem 0.75rem;
      outline: none;
    }
    .input:focus { box-shadow: 0 0 0 2px #6366f1; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex" x-data="dashboard()">

  <!-- Sidebar -->
  <aside class="w-56 shrink-0 bg-slate-800 border-r border-slate-700 flex flex-col min-h-screen fixed top-0 left-0 z-10">
    <div class="px-4 py-5 border-b border-slate-700">
      <p class="text-xs text-slate-400 font-medium uppercase tracking-widest">Polymarket</p>
      <h1 class="text-base font-bold text-white leading-tight">Insider Detection</h1>
    </div>

    <nav class="flex-1 p-3 space-y-1">
      <a href="/"          class="sidebar-item {% if active == 'overview'  %}active{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Overview
      </a>
      <a href="/markets"   class="sidebar-item {% if active == 'markets'   %}active{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        Markets
      </a>
      <a href="/insiders"  class="sidebar-item {% if active == 'insiders'  %}active{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        Insiders
        <span x-show="kpis.total_insiders > 0" x-cloak class="ml-auto bg-red-600 text-white text-xs font-bold px-1.5 py-0.5 rounded-full" x-text="kpis.total_insiders"></span>
      </a>
      <a href="/pipeline"  class="sidebar-item {% if active == 'pipeline'  %}active{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/></svg>
        Pipeline
        <span x-show="pipeline_alert" x-cloak class="ml-auto w-2 h-2 rounded-full bg-yellow-400"></span>
      </a>
      <a href="/trades"    class="sidebar-item {% if active == 'trades'    %}active{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
        Trades
      </a>
      <a href="/variables" class="sidebar-item {% if active == 'variables' %}active{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
        Variables
        <span x-show="kpis.cmv_in_flight > 0" x-cloak class="ml-auto bg-yellow-600 text-white text-xs font-bold px-1.5 py-0.5 rounded-full" x-text="kpis.cmv_in_flight"></span>
      </a>
      <a href="/settings" class="sidebar-item {% if active == 'settings' %}active{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Configuración
      </a>
    </nav>

    <!-- Logout -->
    <div class="px-3 pb-1">
      <a href="/auth/logout" class="sidebar-item text-xs text-slate-500 hover:text-red-400">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Cerrar sesión
      </a>
    </div>

    <!-- SSE status + last update -->
    <div class="p-3 border-t border-slate-700 space-y-2">
      <div class="flex items-center gap-2">
        <span :class="sse_connected ? 'bg-emerald-400' : 'bg-red-400'" class="w-2 h-2 rounded-full shrink-0"></span>
        <span class="text-xs text-slate-400" x-text="sse_connected ? 'Live' : 'Reconectando...'"></span>
      </div>
      <p class="text-xs text-slate-500" x-text="'Actualizado: ' + last_update"></p>
    </div>
  </aside>

  <!-- Toast notification -->
  <div x-show="toast_msg" x-cloak x-transition
       class="fixed top-4 right-4 z-50 bg-indigo-600 text-white px-4 py-3 rounded-xl shadow-xl text-sm max-w-xs"
       x-text="toast_msg"></div>

  <!-- Main content -->
  <main class="ml-56 flex-1 p-6 min-h-screen">
    {% block content %}{% endblock %}
  </main>

<script>
function dashboard() {
  return {
    kpis: { total_wallets: 0, total_insiders: 0, total_markets: 0, closed_markets: 0, total_trades: 0, insider_trades: 0, cmv_in_flight: 0, detections_last_24h: 0 },
    stream_lengths: {},
    pipeline_alert: false,
    sse_connected: false,
    last_update: '—',
    toast_msg: '',
    _toast_timer: null,

    init() {
      this.connectSSE();
    },

    connectSSE() {
      const source = new EventSource('/api/sse/live');

      source.addEventListener('overview_kpis', e => {
        const d = JSON.parse(e.data);
        this.kpis = {...this.kpis, ...d};
        this.last_update = new Date().toLocaleTimeString();
        this.sse_connected = true;
      });

      source.addEventListener('stream_lengths', e => {
        this.stream_lengths = JSON.parse(e.data);
        const total_pending = Object.values(this.stream_lengths).reduce((a, b) => a + b, 0);
        this.pipeline_alert = total_pending > 10;
      });

      source.addEventListener('new_detection', e => {
        const d = JSON.parse(e.data);
        this.showToast(`🚨 Nuevo insider detectado (total: ${d.count})`);
      });

      source.addEventListener('error', () => {
        this.sse_connected = false;
        source.close();
        setTimeout(() => this.connectSSE(), 5000);
      });
    },

    showToast(msg) {
      this.toast_msg = msg;
      clearTimeout(this._toast_timer);
      this._toast_timer = setTimeout(() => this.toast_msg = '', 5000);
    },

    fmt(n) { return (n ?? 0).toLocaleString(); },
    fmtUSD(n) { return '$' + parseFloat(n ?? 0).toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 0}); },
    short(s, n=16) { if (!s) return '—'; return s.length > n ? s.slice(0, 6) + '…' + s.slice(-4) : s; },
  }
}
</script>
</body>
</html>

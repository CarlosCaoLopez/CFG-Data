{% extends "base.html" %}
{% block title %}Insider Detail{% endblock %}
{% block content %}
<div x-data="insiderDetailPage()" x-init="load()">

  <!-- Header -->
  <div class="flex items-center gap-4 mb-6">
    <a href="/insiders" class="btn-ghost text-sm">← Volver</a>
    <h2 class="text-xl font-bold text-white flex-1 font-mono truncate" x-text="wallet"></h2>
    <button @click="load()" class="btn-ghost text-xs">↻ Actualizar</button>
  </div>

  <template x-if="!data">
    <p class="text-slate-500 text-sm">Cargando…</p>
  </template>

  <template x-if="data">
    <div>
      <!-- Stat cards -->
      <div class="grid grid-cols-2 lg:grid-cols-6 gap-4 mb-4">
        <div class="card kpi-card">
          <span class="kpi-value" x-text="data.insider_trades_count"></span>
          <span class="kpi-label">Trades insider</span>
        </div>
        <div class="card kpi-card">
          <span class="kpi-value" x-text="fmtUSD(data.total_volume_usdc)"></span>
          <span class="kpi-label">Volumen total</span>
        </div>
        <div class="card kpi-card">
          <span class="kpi-value" :class="pnlClass(data.pnl_total)" x-text="fmtPnl(data.pnl_total)"></span>
          <span class="kpi-label">PnL estimado</span>
        </div>
        <div class="card kpi-card">
          <span class="kpi-value" x-text="fmtPct(data.hit_rate_total)"></span>
          <span class="kpi-label">Hit rate</span>
        </div>
        <div class="card kpi-card">
          <span class="kpi-value" x-text="data.markets.length"></span>
          <span class="kpi-label">Mercados</span>
        </div>
        <div class="card kpi-card">
          <span class="text-xs font-mono text-slate-300 mt-1" x-text="fmtDate(data.first_tx_polygon)"></span>
          <span class="kpi-label">1ª tx Polygon</span>
        </div>
      </div>

      <!-- Categorías + seguimiento L2 -->
      <div class="card mb-4 flex flex-wrap gap-6 items-center">
        <div>
          <span class="text-slate-500 text-xs uppercase tracking-wide">Categorías insider</span>
          <div class="mt-1 flex flex-wrap gap-1">
            <template x-for="cat in (data.categories_insider || [])"><span class="badge-red" x-text="cat"></span></template>
          </div>
        </div>
        <div>
          <span class="text-slate-500 text-xs uppercase tracking-wide">Seguimiento (L2)</span>
          <div class="mt-1">
            <template x-if="data.l2_monitoring && data.l2_monitoring.monitored">
              <span class="badge-green">● Activo</span>
            </template>
            <template x-if="!data.l2_monitoring || !data.l2_monitoring.monitored">
              <span class="badge-slate">○ Inactivo</span>
            </template>
          </div>
        </div>
        <div x-show="data.l2_monitoring && data.l2_monitoring.monitored">
          <span class="text-slate-500 text-xs uppercase tracking-wide">Último trade visto</span>
          <div class="mt-1 text-xs text-slate-300 font-mono" x-text="fmtDate(data.l2_monitoring?.last_seen_ts)"></div>
        </div>
        <div x-show="data.l2_monitoring && data.l2_monitoring.monitored">
          <span class="text-slate-500 text-xs uppercase tracking-wide">Trades capturados (sesión)</span>
          <div class="mt-1 text-xs text-slate-300" x-text="data.l2_monitoring?.trades_published ?? 0"></div>
        </div>
      </div>

      <!-- Historial de detecciones -->
      <div class="card mb-4" x-show="(data.detections || []).length">
        <h3 class="text-sm font-semibold text-white mb-3">Historial de detecciones</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Market</th><th>Categorías</th><th>Detectado</th><th>Estado</th></tr></thead>
            <tbody>
              <template x-for="d in (data.detections || [])" :key="d.market_id + d.detected_at">
                <tr>
                  <td class="text-xs max-w-xs truncate"><a :href="'/markets/' + d.market_id" class="text-indigo-400 hover:underline" x-text="d.question || d.market_id"></a></td>
                  <td><div class="flex flex-wrap gap-1"><template x-for="c in d.categories_insider"><span class="badge-red text-xs" x-text="c"></span></template></div></td>
                  <td class="text-xs font-mono text-slate-400" x-text="fmtDate(d.detected_at)"></td>
                  <td><span class="badge-slate text-xs" x-text="d.status"></span></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Trades agrupados por mercado -->
      <h3 class="text-sm font-semibold text-white mb-3">Trades por mercado</h3>
      <div class="space-y-3 mb-6">
        <template x-for="m in data.markets" :key="m.market_id">
          <div class="card">
            <div class="flex items-center gap-3 cursor-pointer" @click="toggle(m.market_id)">
              <span class="text-slate-400 text-xs w-4" x-text="expanded[m.market_id] ? '▾' : '▸'"></span>
              <div class="flex-1 min-w-0">
                <a :href="'/markets/' + m.market_id" @click.stop class="text-sm text-white hover:text-indigo-400 truncate block" x-text="m.question || m.market_id"></a>
              </div>
              <span x-show="m.is_detection_market" class="badge-red text-xs shrink-0">Market de detección</span>
              <span :class="m.closed ? 'badge-green' : 'badge-yellow'" class="text-xs shrink-0" x-text="m.closed ? 'Cerrado' : 'Abierto'"></span>
              <span class="text-xs text-slate-400 shrink-0" x-text="m.trades_count + ' trades'"></span>
              <span class="text-xs font-mono text-slate-300 shrink-0" x-text="fmtUSD(m.volume_usdc)"></span>
              <span class="text-xs font-mono shrink-0" :class="pnlClass(m.pnl)" x-text="fmtPnl(m.pnl)"></span>
              <span class="text-xs text-slate-400 shrink-0 w-14 text-right" x-text="fmtPct(m.hit_rate)"></span>
            </div>

            <div x-show="expanded[m.market_id]" x-cloak class="table-wrap mt-3">
              <table>
                <thead>
                  <tr><th>Timestamp</th><th>Side</th><th>Outcome</th><th>Price</th><th class="text-right">USDC</th><th class="text-right">PnL</th><th>Origen</th><th>Last</th></tr>
                </thead>
                <tbody>
                  <template x-for="t in m.trades" :key="t.id">
                    <tr>
                      <td class="text-xs font-mono text-slate-400" x-text="fmtDate(t.timestamp)"></td>
                      <td><span :class="t.side === 'BUY' ? 'badge-green' : 'badge-red'" x-text="t.side"></span></td>
                      <td class="text-xs" x-text="t.outcome"></td>
                      <td class="font-mono text-xs" x-text="parseFloat(t.prize || 0).toFixed(3)"></td>
                      <td class="font-mono text-xs text-right" x-text="fmtUSD(t.size_usdc)"></td>
                      <td class="font-mono text-xs text-right" :class="pnlClass(t.pnl)" x-text="t.pnl === null ? '—' : fmtPnl(t.pnl)"></td>
                      <td><span :class="t.is_detection_trade ? 'badge-red' : 'badge-blue'" x-text="t.is_detection_trade ? 'Detección' : 'Monitoreo'"></span></td>
                      <td><span x-show="t.last_trade" class="badge-yellow">✓</span></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
        <p x-show="!data.markets.length" class="text-center text-slate-500 py-8">Sin trades insider registrados aún</p>
      </div>
    </div>
  </template>
</div>

<script>
function insiderDetailPage() {
  const wallet = {{ wallet | tojson }};
  return {
    wallet,
    data: null,
    expanded: {},

    async load() {
      const r = await fetch('/api/insiders/' + encodeURIComponent(wallet));
      if (!r.ok) { this.data = null; return; }
      this.data = await r.json();
    },

    toggle(marketId) { this.expanded[marketId] = !this.expanded[marketId]; },

    fmtUSD(n) { return '$' + parseFloat(n ?? 0).toLocaleString(undefined, {maximumFractionDigits: 0}); },
    fmtPnl(n) {
      if (n === null || n === undefined) return '—';
      const v = parseFloat(n);
      return (v >= 0 ? '+' : '') + '$' + v.toLocaleString(undefined, {maximumFractionDigits: 0});
    },
    fmtPct(n) { return (n === null || n === undefined) ? '—' : (parseFloat(n) * 100).toFixed(0) + '%'; },
    pnlClass(n) { if (n === null || n === undefined) return 'text-slate-400'; return parseFloat(n) >= 0 ? 'text-emerald-400' : 'text-red-400'; },
    fmtDate(iso) { if (!iso) return '—'; return new Date(iso).toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}); },
  }
}
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Pipeline{% endblock %}
{% block content %}
<div x-data="pipelinePage()" x-init="load(); setInterval(load, 8000)">

  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold text-white">Pipeline Status</h2>
    <span class="text-xs text-slate-400" x-text="'Actualizado: ' + ts"></span>
  </div>

  <!-- Redis Streams -->
  <div class="card mb-6">
    <h3 class="text-sm font-semibold text-slate-300 mb-4">Redis Streams</h3>
    <div class="space-y-3">
      <template x-for="(info, stream) in d.redis" :key="stream">
        <div>
          <div class="flex justify-between text-xs mb-1">
            <span class="font-mono text-slate-300" x-text="stream"></span>
            <span class="text-slate-400">
              <span x-text="info.length + ' msgs'"></span>
              <span class="ml-2" :class="info.pending > 0 ? 'text-yellow-400' : 'text-emerald-400'" x-text="info.pending + ' pending'"></span>
            </span>
          </div>
          <div class="w-full bg-slate-700 rounded-full h-2">
            <div class="h-2 rounded-full transition-all duration-500"
                 :class="info.pending > 0 ? 'bg-yellow-500' : 'bg-emerald-500'"
                 :style="'width: ' + Math.min(100, (info.length / Math.max(maxStream, 1)) * 100) + '%'"></div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
    <!-- Celery workers -->
    <div class="card">
      <h3 class="text-sm font-semibold text-slate-300 mb-4">Celery Workers</h3>
      <div class="grid grid-cols-3 gap-4 mb-4">
        <div class="text-center">
          <p class="text-2xl font-bold" :class="(d.celery?.workers_online ?? 0) > 0 ? 'text-emerald-400' : 'text-red-400'" x-text="d.celery?.workers_online ?? 0"></p>
          <p class="text-xs text-slate-500">Workers online</p>
        </div>
        <div class="text-center">
          <p class="text-2xl font-bold text-yellow-400" x-text="d.celery?.active_tasks ?? 0"></p>
          <p class="text-xs text-slate-500">Tasks activas</p>
        </div>
        <div class="text-center">
          <p class="text-2xl font-bold text-blue-400" x-text="d.celery?.scheduled_tasks ?? 0"></p>
          <p class="text-xs text-slate-500">Programadas</p>
        </div>
      </div>
      <div class="space-y-1">
        <template x-for="name in (d.celery?.worker_names ?? [])">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span class="text-xs font-mono text-slate-400" x-text="name"></span>
          </div>
        </template>
        <p x-show="!d.celery?.worker_names?.length" class="text-xs text-slate-500">Sin workers detectados</p>
      </div>
    </div>

    <!-- L1 Stats -->
    <div class="card">
      <h3 class="text-sm font-semibold text-slate-300 mb-4">
        L1 — Market Close Listener
        <span x-show="!d.l1_stats" class="badge-red ml-2">Unavailable</span>
      </h3>
      <template x-if="d.l1_stats">
        <div>
          <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-slate-700 rounded-lg p-3 text-center">
              <p class="text-xl font-bold text-blue-400" x-text="d.l1_stats.l1?.tracked_markets ?? 0"></p>
              <p class="text-xs text-slate-500">Tracked ahora</p>
            </div>
            <div class="bg-slate-700 rounded-lg p-3 text-center">
              <p class="text-xl font-bold text-emerald-400" x-text="d.l1_stats.l1?.markets_closed_published ?? 0"></p>
              <p class="text-xs text-slate-500">Publicados</p>
            </div>
            <div class="bg-slate-700 rounded-lg p-3 text-center">
              <p class="text-xl font-bold text-indigo-400" x-text="(d.l1_stats.l1?.markets_discovered_ws ?? 0) + (d.l1_stats.l1?.markets_discovered_gamma ?? 0)"></p>
              <p class="text-xs text-slate-500">Descubiertos</p>
            </div>
            <div class="bg-slate-700 rounded-lg p-3 text-center">
              <p class="text-xl font-bold text-slate-400" x-text="d.l1_stats.l1?.markets_filtered_out ?? 0"></p>
              <p class="text-xs text-slate-500">Filtrados</p>
            </div>
          </div>
          <!-- Tracked markets list -->
          <h4 class="text-xs font-semibold text-slate-400 uppercase mb-2">Markets en seguimiento</h4>
          <div class="space-y-1 max-h-40 overflow-y-auto pr-1">
            <template x-for="m in (d.l1_stats.l1?.tracked_market_list ?? [])">
              <div class="flex items-start gap-2 py-1 border-b border-slate-700 last:border-0">
                <span class="badge-blue shrink-0 mt-0.5" x-text="m.category || '?'"></span>
                <span class="text-xs text-slate-300 line-clamp-2" x-text="m.question || m.market_id"></span>
              </div>
            </template>
            <p x-show="!(d.l1_stats.l1?.tracked_market_list?.length)" class="text-xs text-slate-500 text-center py-2">Sin markets en seguimiento</p>
          </div>
        </div>
      </template>
    </div>
  </div>

</div>

<script>
function pipelinePage() {
  return {
    d: { redis: {}, celery: {}, l1_stats: null },
    ts: '—',
    get maxStream() {
      return Math.max(...Object.values(this.d.redis || {}).map(v => v.length || 0), 1);
    },
    async load() {
      try {
        const r = await fetch('/api/pipeline');
        this.d = await r.json();
        this.ts = new Date().toLocaleTimeString();
      } catch(e) { console.error(e); }
    },
  }
}
</script>
{% endblock %}

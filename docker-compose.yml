services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - proyect_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    image: timescale/timescaledb:latest-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: insider
      POSTGRES_PASSWORD: insider_pass
      POSTGRES_DB: insider_detection
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proyect_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insider -d insider_detection"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://insider:insider_pass@postgres:5432/insider_detection
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proyect_net

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m ingestion.main
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO          # DEBUG inunda journald/SD; usar DEBUG solo para depurar
    depends_on:
      - redis
    networks:
      - proyect_net
    deploy:
      resources:
        limits:
          memory: 192M

  backfill:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m ingestion.backfill_runner
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://insider:insider_pass@postgres:5432/insider_detection
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - proyect_net

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "poetry run alembic upgrade head &&
            python -m queue_system"
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://insider:insider_pass@postgres:5432/insider_detection
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - proyect_net
    deploy:
      resources:
        limits:
          memory: 192M

  api:
    build: .
    container_name: python_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://insider:insider_pass@postgres:5432/insider_detection
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - proyect_net
    deploy:
      resources:
        limits:
          memory: 160M

  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
      network: host
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=insider_detection
      - POSTGRES_USER=insider
      - POSTGRES_PASSWORD=insider_pass
      - API_URL=http://api:8000
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - proyect_net
    deploy:
      resources:
        limits:
          memory: 320M

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: poetry run celery -A workers.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://insider:insider_pass@postgres:5432/insider_detection
      - INFERENCE_URL=http://inference:8000
      - LOG_DIR=/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - proyect_net
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 288M
    volumes:
      - .:/app
      - ./logs:/app/logs

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A workers.celery_app beat --loglevel=info
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://insider:insider_pass@postgres:5432/insider_detection
      - LOG_DIR=/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - proyect_net
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 96M

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn dashboard.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://insider:insider_pass@postgres:5432/insider_detection
      - INGESTION_STATS_URL=http://ingestion:9001
    ports:
      - "8002:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - proyect_net
    volumes:
      - ./dashboard:/app/dashboard
    deploy:
      resources:
        limits:
          memory: 160M

  mail-monitor:
    build: ./mail-monitor
    container_name: mail-monitor
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  redis_data:
  postgres_data:

networks:
  proyect_net:
    driver: bridge

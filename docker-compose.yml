services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - proyect_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: insider
      POSTGRES_PASSWORD: insider_pass
      POSTGRES_DB: insider_detection
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proyect_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insider -d insider_detection"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m ingestion.main
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - proyect_net

  backfill:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m ingestion.backfill_runner
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://insider:insider_pass@postgres:5432/insider_detection
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - proyect_net

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m queue_system
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://insider:insider_pass@postgres:5432/insider_detection
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - proyect_net

  api:
    build: .
    container_name: python_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://insider:insider_pass@postgres:5432/insider_detection
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - proyect_net

  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=insider_detection
      - POSTGRES_USER=insider
      - POSTGRES_PASSWORD=insider_pass
      - API_URL=http://api:8000
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - proyect_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A workers.celery_app worker --loglevel=info
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://insider:insider_pass@postgres:5432/insider_detection
      - INFERENCE_URL=http://inference:8000
      - LOG_DIR=/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - proyect_net
    deploy:
      replicas: 4
    volumes:
      - ./logs:/app/logs

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A workers.celery_app beat --loglevel=info
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://insider:insider_pass@postgres:5432/insider_detection
      - LOG_DIR=/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - proyect_net
    volumes:
      - ./logs:/app/logs

volumes:
  redis_data:
  postgres_data:

networks:
  proyect_net:
    driver: bridge

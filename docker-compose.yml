services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: insider
      POSTGRES_PASSWORD: insider_pass
      POSTGRES_DB: insider_detection
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m ingestion.backfill_runner
    env_file: .env
    depends_on:
      - redis


  api:
    build: .
    container_name: python_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000" # Solo visible para otros contenedores
    networks:
      - proyect_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m workers.worker
    env_file: .env
    depends_on:
      - redis
      - postgres
      - api
    networks:
      - proyect_net
    deploy:
      replicas: 4
    volumes:
      - ./logs:/app/logs
    environment:
      - LOG_DIR=/app/logs



volumes:
  redis_data:
  postgres_data:

networks:
  proyect_net:
    driver: bridge
